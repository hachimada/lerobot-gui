# pre-commit install   (then the hooks run on every commit; CI runs the same checks)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        exclude: ^docs/images/ # the README's demo is larger than the 500 KB limit
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4 # keep in step with ruff in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: frontend-lint
        name: eslint + tsc (frontend)
        entry: bash -c 'cd frontend && npm run --silent lint && npm run --silent check:api && npm run --silent typecheck'
        language: system
        files: ^frontend/
        pass_filenames: false

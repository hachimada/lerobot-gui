<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- the server puts the API token here when it serves the page -->
    <meta name="lerobot-gui-token" content="__TOKEN__" />
    <title>LeRobot GUI</title>
    <script>
      // the theme before the first paint (src/lib/theme.ts keeps it afterwards): the choice kept in
      // this browser, else the system's
      (function () {
        var choice = 'auto';
        try {
          choice = localStorage.getItem('lerobot-gui:theme') || 'auto';
        } catch (e) {}
        var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23FFD21E'/%3E%3Cpath d='M7 16l4-8 2 4 2-2 2 6' fill='none' stroke='%230b0f19' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
